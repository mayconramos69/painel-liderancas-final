<!DOCTYPE html><html lang="pt-br"><head><meta charset="UTF-8"><title>Área de Trabalho</title><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="{{ url_for('static', filename='style.css', v='3') }}"></head><body>{% with messages = get_flashed_messages() %}{% if messages %}<div class="flash">{% for msg in messages %}<p>{{ msg }}</p>{% endfor %}</div>{% endif %}{% endwith %}{% block content %}{% endblock %}<script>
(function(){
  const ufs={"01":"São Paulo","02":"Minas Gerais","03":"Rio de Janeiro","04":"Rio Grande do Sul","05":"Bahia","06":"Paraná","07":"Ceará","08":"Pernambuco","09":"Santa Catarina","10":"Goiás","11":"Maranhão","12":"Paraíba","13":"Pará","14":"Espírito Santo","15":"Piauí","16":"Rio Grande do Norte","17":"Alagoas","18":"Mato Grosso","19":"Mato Grosso do Sul","20":"Distrito Federal","21":"Sergipe","22":"Amazonas","23":"Rondônia","24":"Acre","25":"Amapá","26":"Roraima","27":"Tocantins","28":"Exterior"};
  function analisar(valor){
    const d=(valor||'').replace(/\D/g,'');
    if(!d) return {estado:'vazio',texto:'Digite os 12 números para verificar.'};
    if(d.length!==12) return {estado:'invalido',texto:'Título inválido: precisa ter 12 números. Origem não identificada.'};
    const uf=ufs[d.slice(8,10)]||'Origem não identificada';
    const n=[...d].map(Number);
    const pesos=[9,8,7,6,5,4,3,2];
    const r1=n.slice(0,8).reduce((s,v,i)=>s+v*pesos[i],0)%11;
    const dv1=(r1===0||r1===1)?0:11-r1;
    const r2=(n[8]*4+n[9]*3+dv1*2)%11;
    const dv2=(r2===0||r2===1)?0:11-r2;
    const ok=n[10]===dv1&&n[11]===dv2&&ufs[d.slice(8,10)];
    return {estado:ok?'valido':'invalido',texto:(ok?'Título válido':'Título inválido')+' • Origem: '+uf};
  }
  function atualizar(input){
    let box=input.parentElement.querySelector('.titulo-feedback');
    if(!box){ box=document.createElement('div'); box.className='titulo-feedback'; input.insertAdjacentElement('afterend',box); }
    const r=analisar(input.value); input.classList.remove('titulo-valido','titulo-invalido'); box.className='titulo-feedback '+r.estado; box.textContent=r.texto;
    if(r.estado==='valido') input.classList.add('titulo-valido');
    if(r.estado==='invalido') input.classList.add('titulo-invalido');
    const form=input.closest('.form-trabalho-validado');
    if(form){ const botao=form.querySelector('button[type=submit]'); if(botao){ botao.disabled=false; botao.title=''; } }
  }
  document.querySelectorAll('input[name="numero_titulo"]').forEach(input=>{
    input.setAttribute('inputmode','numeric'); input.setAttribute('maxlength','14');
    input.addEventListener('input',()=>atualizar(input)); atualizar(input);
  });
})();
</script><script>
(function(){
  const key='painel-scroll:'+location.pathname+location.search;
  const saved=sessionStorage.getItem(key);
  if(saved!==null){requestAnimationFrame(()=>window.scrollTo(0,Number(saved)));sessionStorage.removeItem(key);}
  document.addEventListener('submit',()=>sessionStorage.setItem(key,String(window.scrollY)));
  document.addEventListener('click',e=>{const a=e.target.closest('a');if(a&&a.href&&a.origin===location.origin)sessionStorage.setItem(key,String(window.scrollY));});
})();
</script>
</body></html>
